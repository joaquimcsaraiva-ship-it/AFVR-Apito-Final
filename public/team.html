<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipa | AFVR Apito Final</title>

<link
  rel="icon"
  type="image/png"
  href="/images/logo-afvr-apito-final.png"
>

  <link rel="stylesheet" href="/css/layout.css">
</head>

<body>

  <main class="team-page">

    <section class="team-header">
  <div class="team-header-content">
    <div>
      <a class="team-back-link" href="/">
        ← Voltar ao início
      </a>

      <h1 id="teamName">Equipa</h1>
      <p id="teamSummary">A carregar...</p>
    </div>

    <button
      id="favoriteTeamButton"
      class="team-favorite-button"
      type="button"
      aria-pressed="false"
    >
      ☆ Adicionar aos favoritos
    </button>
  </div>
</section>

<section
  id="teamContext"
  class="team-context"
  aria-label="Contexto da equipa"
>
</section>

    <section class="panel">
      <h2>Estatísticas</h2>
      <div id="teamStats"></div>
    </section>

<section class="panel">
  <h2>Competições</h2>
  <div id="teamCompetitions">
    <p>A carregar competições...</p>
  </div>
</section>

<section class="panel">
  <h2>Classificação</h2>

  <div id="teamStandings">
    <p>A carregar classificação...</p>
  </div>
</section>

    <section class="panel">
      <h2>Últimos Resultados</h2>
      <div id="recentResults"></div>
    </section>

    <section class="panel">
      <h2>Próximos Jogos</h2>
      <div id="upcomingMatches"></div>
    </section>

  </main>

  <script src="/team.js"></script>

</body>
</html>
